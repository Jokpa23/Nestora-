  <circle cx="26" cy="35.6" r="1.9" fill="#9e6a44"/>
  <text x="64" y="36" font-family="Manrope, Inter, 'DM Sans', system-ui, sans-serif" font-size="23" font-weight="800" letter-spacing="6.2" fill="#171714">NESTORA</text>
  <text x="65" y="48" font-family="Manrope, Inter, 'DM Sans', system-ui, sans-serif" font-size="7.4" font-weight="700" letter-spacing="1.9" fill="#7b7568">FIND A PLACE THAT FEELS LIKE HOME</text>
