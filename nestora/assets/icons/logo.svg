  <g fill="none" stroke="#171714" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="9" width="46" height="46" rx="13" stroke-opacity="0.28" stroke-width="1.4"/>
    <path d="M16 32.5 26 23.2l10 9.3"/>
    <path d="M19.6 31.4V39a1.8 1.8 0 0 0 1.8 1.8h9.2A1.8 1.8 0 0 0 32.4 39v-7.6"/>
